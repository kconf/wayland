[bootstrap.packages]
# Wayland utilities
"pacman:wl-clipboard" = "latest"
"pacman:dunst" = "latest"
"pacman:uwsm" = "latest"
"pacman:qt5-wayland" = "latest"

# Desktop shell
"pacman:dms-shell" = "latest"

# Window managers and their dependencies
"pacman:hyprland" = "latest"
"pacman:niri" = "latest"
"pacman:xdg-desktop-portal-gnome" = "latest"
"pacman:xwayland-satellite" = "latest"

[tasks.bootstrap]
description = "Install sway-scroll and enable DMS for graphical sessions"
run = '''
#!/usr/bin/env bash
set -euo pipefail

systemctl --user enable dms.service

if systemctl --user is-active --quiet graphical-session.target; then
  systemctl --user start dms.service
fi
'''
